# =============================================================================
# FanCue — Render.com Web Service Declaration
# =============================================================================
# Deploy from repository root. backend/Dockerfile copies backend/, ingestion/,
# contracts/, and data/. The two supported fixtures are tracked in
# data/raw/1529229.json and data/raw/1552779.json; validate them in the built image.
#
# Render dashboard environment variables:
#   FANCUE_ENV=production
#   ALLOWED_ORIGINS=https://fan-cue.vercel.app
#   LLM_PROVIDER=groq (already specified below)
#   GROQ_API_KEY=<secret> (required for live Groq generation; omit for fallback)
#   CRICKET_DATA_API_KEY=<secret> (optional; near-live data only)
#   QDRANT_URL / QDRANT_API_KEY (optional; retrieval disabled by default below)
#
# No credentials belong in this file or any VITE_* variable.
# =============================================================================

services:
  - type: web
    name: fancue-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: .
    plan: free
    region: singapore
    healthCheckPath: /healthz

    envVars:
      - key: FANCUE_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SKIP_LLM_IN_TESTS
        value: "false"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_TIMEOUT_SECONDS
        value: "30"
      - key: FANCUE_RETRIEVAL_ENABLED
        value: "false"
      # Secret values are set in the Render dashboard.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CRICKET_DATA_API_KEY
        sync: false
