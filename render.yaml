# =============================================================================
# FanCue — Render.com Web Service Declaration
# =============================================================================
# Deploy the FanCue FastAPI backend on Render using the existing Dockerfile.
#
# OPERATOR STEPS (one-time):
#   1. Create a free/paid Render account at https://render.com
#   2. Connect your GitHub/GitLab repository (or push this repo to a remote).
#   3. Render auto-detects this render.yaml and pre-fills the service config.
#   4. In the Render dashboard → Environment → Secret Files or Environment Vars:
#        OPENAI_API_KEY=sk-...             (required for live AI; omit to use deterministic fallback)
#        ALLOWED_ORIGINS=https://your-frontend.vercel.app
#        FANCUE_ENV=production
#        LOG_LEVEL=INFO
#        SKIP_LLM_IN_TESTS=false
#        QDRANT_URL=https://...            (optional — if you have Qdrant Cloud)
#        QDRANT_API_KEY=...               (optional)
#   5. Deploy. Render builds the Docker image and starts uvicorn.
#
# IMPORTANT:
#   - Never commit actual secret values here.
#   - data/raw/ is NOT in .gitignore for Render-hosted repos because Render
#     builds from the repo. If data/raw/ is git-ignored on your remote,
#     provide fixtures via a Render Secret File or mount.
# =============================================================================

services:
  - type: web
    name: fancue-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # Build context is the repo root so `COPY data/ ./data/` works in Dockerfile
    rootDir: .
    plan: free          # upgrade to starter/standard for production workloads
    region: singapore   # choose nearest to your users
    healthCheckPath: /healthz

    envVars:
      - key: FANCUE_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SKIP_LLM_IN_TESTS
        value: "false"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_TIMEOUT_SECONDS
        value: "30"
      - key: FANCUE_RETRIEVAL_ENABLED
        value: "false"  # Temporary free-instance mitigation; match facts and LLM verification remain active.
      # PORT is injected automatically by Render — do not set it here.
      # -----------------------------------------------------------------------
      # Secret vars — set these in the Render dashboard, NOT here.
      # -----------------------------------------------------------------------
      - key: GROQ_API_KEY
        sync: false      # Set your Groq API key in the Render dashboard
      - key: OPENAI_API_KEY
        sync: false      # Optional — set if using LLM_PROVIDER=openai
      - key: ALLOWED_ORIGINS
        sync: false      # Set to your Vercel frontend URL, e.g. https://fancue.vercel.app
      - key: QDRANT_URL
        sync: false      # Optional — leave blank to run without Qdrant Cloud
      - key: QDRANT_API_KEY
        sync: false      # Optional
      - key: CRICKET_DATA_API_KEY
        sync: false      # Required for authenticated near-live match discovery; obtain from CricketData.org
